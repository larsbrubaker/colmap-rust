# colmap-web: the browser shell (wasm cdylib). Thin glue over agg-gui-web-shell (canvas, WebGPU
# surface, requestAnimationFrame loop, DOM input); all UI lives in colmap-app. Built by
# `web/build.sh` with wasm-pack; natively it compiles to an empty rlib so
# `cargo build --workspace` stays green on every platform.
[package]
name = "colmap-web"
description = "COLMAP Rust in the browser: agg-gui-web-shell canvas around colmap-app (WebGPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "colmap_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
agg-gui = { path = "../../agg-gui/agg-gui" }
# Default features include `webgpu` (wgpu's browser WebGPU backend).
agg-gui-web-shell = { path = "../../agg-gui/agg-gui-web-shell" }
colmap-app = { path = "../colmap-app" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.82", features = ["Window", "Element", "HtmlCanvasElement"] }
