# colmap-rust core library: the pure-Rust port of COLMAP (no GUI, no GPU).
[package]
name = "colmap-rust"
description = "Pure-Rust port of COLMAP (Structure-from-Motion and Multi-View Stereo)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "colmap_rust"
path = "src/lib.rs"

[dependencies]
# Pure-Rust libm (musl port): bit-identical on every target; docs/CPP_DIVERGENCES.md entry 1.
# Caret requirement on purpose: a libm update that changes any bits is caught by the
# tests/math/fns_probe.rs tables, which CI checks natively and on wasm32-wasip1 (wasmtime).
libm = "0.2"
